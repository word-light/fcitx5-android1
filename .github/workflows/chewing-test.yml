name: Chewing fuzzy test

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'tools/chewing-test/**'
      - '.github/workflows/chewing-test.yml'

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: false
      - name: Look for Cangjie tables
        run: |
          exec > >(tee /tmp/log.txt) 2>&1
          sudo apt-get update -qq
          apt-cache policy fcitx5-table-extra fcitx5-table-cangjie 2>&1 | head
          sudo apt-get install -y fcitx5-table-extra || true
          dpkg -L fcitx5-table-extra | grep -i "cangjie\|quick\|cj" || true
          ls -la /usr/share/libime /usr/share/fcitx5/table 2>/dev/null | head -50
          cat /usr/share/fcitx5/inputmethod/cangjie5.conf 2>/dev/null | head -40
      - name: Publish log
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete chewing-test --yes --cleanup-tag || true
          gh release create chewing-test /tmp/log.txt --title "chewing test log" --notes "test" --prerelease
