name: Build SogaKey

# Builds the keyboard + Zhuyin + Korean plugins for arm64 phones (e.g. Samsung A56)
# and publishes them as the "latest" release, downloadable from a phone browser.

on:
  push:
    branches: [master]
    paths-ignore:
      - 'tools/**'
      - '.github/workflows/chewing-test.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sogakey
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      BUILD_ABI: arm64-v8a
      SIGN_KEY_FILE: ${{ github.workspace }}/signing/sogakey.jks
      SIGN_KEY_PWD: sogakey-personal
      SIGN_KEY_ALIAS: sogakey
    steps:
      - name: Fetch source code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Apply SogaKey patches
        run: |
          git -C plugin/chewing/src/main/cpp/fcitx5-chewing apply "$GITHUB_WORKSPACE/patches/chewing-sogakey.patch"
          git -C plugin/chewing/src/main/cpp/fcitx5-chewing diff --stat

      - name: Rename Anthy to 日本語 in the input method list
        run: |
          sed -i 's/^Name=Anthy$/Name=日本語 (Anthy)/' plugin/anthy/src/main/cpp/fcitx5-anthy/src/anthy.conf.in
          grep -n '^Name' plugin/anthy/src/main/cpp/fcitx5-anthy/src/anthy.conf.in

      - name: Add Traditional Cangjie / Quick tables
        run: |
          P=lib/fcitx5/src/main/cpp/prebuilt
          mkdir -p $P/sogakey-im $P/libime/table
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends fcitx5-table-cangjie5 fcitx5-table-cangjie3 fcitx5-table-quick5 || true
          for n in cangjie5 cangjie3 quick5; do
            cp /usr/share/fcitx5/table/$n.main.dict $P/libime/table/ || true
            cp /usr/share/fcitx5/inputmethod/$n.conf $P/sogakey-im/ || true
          done
          ls -la $P/sogakey-im $P/libime/table

      - name: Prepare modern word frequency list
        run: |
          mkdir -p tmpfreq
          if curl -fsSL https://raw.githubusercontent.com/fxsjy/jieba/master/extra_dict/dict.txt.big -o tmpfreq/dict.txt.big; then
            python3 - <<'PY'
          import re
          cjk = re.compile(r'[\u4e00-\u9fff]+')
          words = []
          agg = {}
          for line in open('tmpfreq/dict.txt.big', encoding='utf-8'):
              parts = line.split()
              if len(parts) < 2 or not parts[1].isdigit():
                  continue
              word, freq = parts[0], int(parts[1])
              if not cjk.fullmatch(word) or freq < 3:
                  continue
              words.append((word, freq))
              if len(word) >= 2:
                  for ch in set(word):
                      agg[ch] = agg.get(ch, 0) + freq
          out = []
          seen_single = set()
          for word, freq in words:
              if len(word) == 1:
                  # single characters: how often they appear inside words overall
                  score = max(freq, agg.get(word, 0))
                  seen_single.add(word)
                  out.append(word + '\t' + str(score))
              elif len(word) <= 4 and freq >= 20:
                  out.append(word + '\t' + str(freq))
          for ch, score in agg.items():
              if ch not in seen_single:
                  out.append(ch + '\t' + str(score))
          open('lib/fcitx5/src/main/cpp/prebuilt/chewing-dict/sogakey-freq.tsv', 'w', encoding='utf-8').write('\n'.join(out) + '\n')
          print(len(out), 'words')
          PY
            ls -la lib/fcitx5/src/main/cpp/prebuilt/chewing-dict/
          else
            echo "word list unavailable, skipping"
          fi

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Android environment
        uses: android-actions/setup-android@v4
        with:
          packages: cmake;3.31.6

      - name: Install system dependencies
        run: |
          sudo apt update
          sudo apt install extra-cmake-modules gettext

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build APKs
        run: ./gradlew :app:assembleRelease :plugin:chewing:assembleRelease :plugin:hangul:assembleRelease :plugin:anthy:assembleRelease

      - name: Collect APKs
        run: |
          mkdir out
          cp "$(ls app/build/outputs/apk/release/*.apk | head -1)" out/1-SogaKey-main.apk
          cp "$(ls plugin/chewing/build/outputs/apk/release/*.apk | head -1)" out/2-SogaKey-zhuyin-plugin.apk
          cp "$(ls plugin/hangul/build/outputs/apk/release/*.apk | head -1)" out/3-SogaKey-korean-plugin.apk
          cp "$(ls plugin/anthy/build/outputs/apk/release/*.apk | head -1)" out/4-SogaKey-japanese-plugin.apk
          ls -la out

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: SogaKey-apks
          path: out/

      - name: Publish "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest out/*.apk \
            --title "SogaKey 最新版（第 ${{ github.run_number }} 版）" \
            --notes "安裝順序：1 主程式 → 2 注音外掛 → 3 韓文外掛、4 日文外掛（不用可略過）。更新時直接安裝新版覆蓋即可。" \
            --latest
